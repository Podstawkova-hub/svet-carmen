<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Beruška a Brouček | Svět Carmen</title>

  <style>
    :root{
      --pink:#ff74b8;
      --deep:#a52d6f;
      --text:#3b2230;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Georgia, "Times New Roman", serif;
      background:linear-gradient(180deg,#fff3fb,#ffe1f1,#fff8ec);
      color:var(--text);
      text-align:center;
    }

    header{
      padding:35px 18px 20px;
    }

    h1{
      margin:0;
      color:var(--deep);
      font-size:34px;
    }

    p{
      max-width:820px;
      margin:12px auto;
      font-size:18px;
      line-height:1.6;
    }

    .top-actions{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:14px;
      flex-wrap:wrap;
      margin-top:16px;
    }

    .back{
      display:inline-block;
      padding:10px 18px;
      border-radius:999px;
      background:var(--deep);
      color:white;
      text-decoration:none;
      font-weight:bold;
    }

    .story-like-btn{
      border:0;
      border-radius:999px;
      padding:10px 18px;
      color:#fff;
      background:linear-gradient(135deg,var(--deep),var(--pink));
      cursor:pointer;
      box-shadow:0 9px 23px rgba(165,45,111,.21);
      transition:
        transform .2s ease,
        box-shadow .2s ease;
      white-space:nowrap;
      font:inherit;
      font-weight:bold;
    }

    .story-like-btn:hover:not(:disabled){
      transform:translateY(-1px);
      box-shadow:0 13px 28px rgba(165,45,111,.27);
    }

    .story-like-btn.is-liked{
      color:var(--deep);
      background:#fff;
      outline:2px solid var(--pink);
    }

    .story-like-btn:disabled{
      cursor:default;
    }

    .music{
      margin:22px auto;
      padding:15px;
    }

    audio{
      width:min(90%,520px);
    }

    .book{
      max-width:980px;
      margin:0 auto 40px;
      padding:10px;
    }

    .page{
      margin:24px auto;
      padding:10px;
      background:white;
      border-radius:22px;
      box-shadow:0 8px 28px rgba(165,45,111,.18);
    }

    .page img{
      width:100%;
      height:auto;
      display:block;
      border-radius:16px;
    }

    footer{
      padding:30px 15px 45px;
      color:#7b4a60;
    }

    @media(max-width:600px){
      h1{
        font-size:30px;
      }

      p{
        font-size:17px;
      }

      .back,
      .story-like-btn{
        width:min(100%,320px);
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Beruška a Brouček</h1>

  <p>
    Komiks věnovaný Eny od Carmen. Příběh o přátelství, které nevzniklo náhodou,
    ale díky jednomu obyčejnému okamžiku, který změnil všechno.
  </p>

  <div class="top-actions">
    <a class="back" href="svet.html">
      ← Zpět do Světa Carmen
    </a>

    <button
      class="story-like-btn"
      id="likeButton"
      type="button"
      aria-label="Dát příběhu Beruška a Brouček srdce"
      disabled
    >
      ♡ Líbí se mi tento příběh…
    </button>
  </div>
</header>

<section class="music">
  <p>Hudba ke komiksu:</p>

  <audio controls>
    <source src="Ladybug%20Little%20Bug%20-%20navrh.mp3" type="audio/mpeg">
    Tvůj prohlížeč nepodporuje přehrávání hudby.
  </audio>
</section>

<main class="book">
  <div class="page"><img src="obalka.png" alt="Obálka komiksu Beruška a Brouček"></div>
  <div class="page"><img src="strana-1.png" alt="Strana 1"></div>
  <div class="page"><img src="strana-2.png" alt="Strana 2"></div>
  <div class="page"><img src="strana-3.png" alt="Strana 3"></div>
  <div class="page"><img src="strana-4.png" alt="Strana 4"></div>
  <div class="page"><img src="strana-5.png" alt="Strana 5"></div>
  <div class="page"><img src="strana-6.png" alt="Strana 6"></div>
  <div class="page"><img src="strana-7.png" alt="Strana 7"></div>
  <div class="page"><img src="strana-8.png" alt="Strana 8"></div>
  <div class="page"><img src="strana-9.png" alt="Strana 9"></div>
  <div class="page"><img src="strana-10.png" alt="Strana 10"></div>
  <div class="page"><img src="stranka-11.png" alt="Strana 11"></div>
  <div class="page"><img src="strana-12.png" alt="Strana 12"></div>
  <div class="page"><img src="zadni-strana.png" alt="Zadní strana"></div>
</main>

<footer>
  <p>Vytvořeno srdcem pro Eny. 🐞</p>
</footer>

<script>
(function () {
  "use strict";

  const SUPABASE_URL = "https://lggboavbzzvoomveewtl.supabase.co";
  const SUPABASE_KEY = "sb_publishable_3Z7UGlah1I0yJE7gHQQ57A_1XNEeauM";
  const PAGE_ID = "beruska-a-broucek";

  const likeButton = document.getElementById("likeButton");
  const storageKey = `svetCarmenLike_${PAGE_ID}`;

  function getToday() {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
  }

  async function callSupabase(functionName) {
    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/rpc/${functionName}`,
      {
        method: "POST",
        headers: {
          apikey: SUPABASE_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          requested_page_id: PAGE_ID
        })
      }
    );

    if (!response.ok) {
      throw new Error(await response.text());
    }

    return response.json();
  }

  function showReady(count) {
    likeButton.textContent =
      `♡ Líbí se mi tento příběh ${Number(count) || 0}`;

    likeButton.disabled = false;
    likeButton.classList.remove("is-liked");
  }

  function showThankYou(count) {
    likeButton.textContent =
      `♥ Děkujeme ${Number(count) || 0}`;

    likeButton.disabled = true;
    likeButton.classList.add("is-liked");
  }

  async function loadLikes() {
    try {
      const count = await callSupabase("get_page_likes");

      if (localStorage.getItem(storageKey) === getToday()) {
        showThankYou(count);
      } else {
        showReady(count);
      }
    } catch (error) {
      console.error("Počet srdcí se nepodařilo načíst:", error);
      likeButton.textContent = "♡ Líbí se mi tento příběh";
      likeButton.disabled = false;
    }
  }

  likeButton.addEventListener("click", async function () {
    if (
      likeButton.disabled ||
      localStorage.getItem(storageKey) === getToday()
    ) {
      return;
    }

    likeButton.disabled = true;
    likeButton.textContent = "♡ Odesílám…";

    try {
      const newCount = await callSupabase("add_page_like");

      localStorage.setItem(storageKey, getToday());
      showThankYou(newCount);
    } catch (error) {
      console.error("Srdce se nepodařilo odeslat:", error);
      likeButton.textContent = "♡ Zkusit znovu";
      likeButton.disabled = false;
    }
  });

  loadLikes();
})();
</script>

</body>
</html>
