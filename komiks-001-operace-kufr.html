<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operace kufr | Svět Carmen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800;900&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#f35ca8;--deep:#b72f78;--ink:#23151f;--comic:"Bangers","Arial Black",sans-serif;--sans:"Nunito",Arial,sans-serif;--serif:"Playfair Display",Georgia,serif;--hand:"Caveat","Segoe Print",cursive}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{min-height:100vh;overflow-x:hidden;color:var(--ink);background:#2b1324;font-family:var(--sans)}a{color:inherit;text-decoration:none}button{border:0;font:inherit}
.topbar{position:sticky;top:0;z-index:1000;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:78px;padding:10px 5vw;background:rgba(255,251,248,.98);border-bottom:1px solid rgba(183,47,120,.12);box-shadow:0 10px 30px rgba(51,18,39,.08);backdrop-filter:blur(14px)}
.brand{justify-self:start;color:#322129;font-family:var(--serif);font-size:16px;line-height:.9}.brand strong{display:block;color:var(--pink);font-size:29px;font-style:italic;font-weight:500}
.main-nav{display:flex;justify-content:center;gap:30px;font-size:15px;font-weight:800}.main-nav a{color:#634b58}.main-nav a:hover{color:var(--deep)}
.top-like-btn{justify-self:end;min-width:145px;padding:11px 18px;color:#fff;background:linear-gradient(135deg,var(--deep),var(--pink));border-radius:999px;box-shadow:0 10px 25px rgba(183,47,120,.24);cursor:pointer;font-size:14px;font-weight:900;white-space:nowrap}.top-like-btn.is-liked{color:var(--deep);background:#fff;outline:2px solid var(--pink)}.top-like-btn:disabled{cursor:default}
.comic-world{position:relative;min-height:calc(100vh - 78px);padding:36px 18px 54px;overflow:hidden;background:radial-gradient(circle at 16% 14%,rgba(255,255,255,.11),transparent 20%),radial-gradient(circle at 86% 12%,rgba(255,255,255,.08),transparent 22%),linear-gradient(155deg,#6b244d 0%,#351729 45%,#180f19 100%)}
.comic-world::before{position:absolute;inset:0;content:"";opacity:.15;pointer-events:none;background:radial-gradient(circle,#fff 0 1.4px,transparent 1.8px);background-size:15px 15px}.comic-world::after{position:absolute;inset:0;content:"";pointer-events:none;background:linear-gradient(135deg,transparent 46%,rgba(255,255,255,.04) 47% 48%,transparent 49%) 0 0/95px 95px}
.pop{position:absolute;z-index:1;font-family:var(--comic);font-size:clamp(48px,7vw,92px);text-shadow:5px 5px 0 #170e16,-2px -2px 0 #170e16;opacity:.85;pointer-events:none}.pop.left{top:95px;left:3vw;color:#ffc84f;transform:rotate(-10deg)}.pop.right{top:130px;right:3vw;color:#ff6fac;transform:rotate(9deg)}
.reader{position:relative;z-index:3;width:min(900px,96vw);margin:0 auto}.reader-title{margin-bottom:22px;text-align:center;color:#fff6df;font-family:var(--comic);font-size:clamp(44px,6vw,72px);letter-spacing:.04em;line-height:.95;text-shadow:4px 4px 0 rgba(0,0,0,.35),7px 7px 0 rgba(243,92,168,.20)}
.stage{width:min(620px,94vw);margin:0 auto;perspective:1800px}.page-shell{position:relative;width:100%;transform-style:preserve-3d;transform-origin:left center;transition:transform .28s ease,opacity .28s ease}.page-shell.flip-next-out{transform:rotateY(-88deg);opacity:.18}.page-shell.flip-next-in{transform:rotateY(88deg);opacity:.18;transition:none}.page-shell.flip-prev-out{transform-origin:right center;transform:rotateY(88deg);opacity:.18}.page-shell.flip-prev-in{transform-origin:right center;transform:rotateY(-88deg);opacity:.18;transition:none}
.cover-view,.comic-page{position:relative;width:100%;overflow:hidden;border:6px solid #171017;border-radius:18px;background:#111;box-shadow:15px 18px 0 rgba(0,0,0,.25),0 30px 55px rgba(0,0,0,.38)}.cover-view img,.comic-page img{display:block;width:100%;height:auto}
.cover-actions{position:absolute;inset:auto 0 24px;display:flex;justify-content:center;padding:0 22px}.start-button,.nav-button,.back-library{display:inline-flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,var(--deep),var(--pink));border:3px solid #171017;border-radius:999px;box-shadow:7px 8px 0 rgba(0,0,0,.23);cursor:pointer;font-weight:900}.start-button{min-width:250px;min-height:58px;padding:14px 28px;font-size:18px;border-width:4px}.status{margin-top:22px;text-align:center;color:#fff;font-size:15px;font-weight:900;letter-spacing:.04em}
.controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;width:min(760px,96vw);margin:20px auto 0}.controls.hidden{display:none}.nav-button{min-height:52px;padding:13px 24px}.nav-button:disabled{opacity:.35;cursor:default}.nav-button.prev{justify-self:start}.nav-button.next{justify-self:end}
.dots{display:flex;justify-content:center;gap:7px}.dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.28)}.dot.active{background:#ff9dca;transform:scale(1.35)}
.end-panel{display:none;margin-top:26px;text-align:center}.end-panel.show{display:block}.end-box{display:inline-block;padding:22px 28px;color:#25161f;background:#fff5c9;border:4px solid #171017;border-radius:24px;box-shadow:9px 10px 0 rgba(0,0,0,.22)}.end-box h2{color:var(--deep);font-family:var(--comic);font-size:44px}.back-library{margin-top:20px;padding:14px 24px}
.error-box{min-height:420px;display:grid;place-items:center;padding:30px;color:#fff;background:#4c1c33;text-align:center;font-weight:900;line-height:1.6}footer{position:relative;z-index:3;padding:26px 20px 6px;text-align:center;color:rgba(255,255,255,.72);font-family:var(--hand);font-size:27px}
@media(max-width:700px){.topbar{grid-template-columns:1fr auto;min-height:70px;padding:9px 4vw}.brand{font-size:14px}.brand strong{font-size:25px}.main-nav{display:none}.top-like-btn{min-width:0;max-width:140px;padding:10px 13px;overflow:hidden;font-size:12px;text-overflow:ellipsis}.comic-world{min-height:calc(100vh - 70px);padding:26px 10px 42px}.pop{display:none}.reader-title{font-size:45px}.stage{width:min(440px,94vw)}.cover-actions{bottom:16px}.start-button{min-width:210px;min-height:52px;font-size:16px}.controls{grid-template-columns:1fr 1fr;gap:12px}.dots{grid-column:1/-1;grid-row:1;margin-bottom:4px}.nav-button{min-height:48px;padding:12px 16px;font-size:14px}.nav-button.prev{grid-column:1;grid-row:2}.nav-button.next{grid-column:2;grid-row:2}}
</style>
</head>
<body>
<header class="topbar">
<a class="brand" href="index.html">Svět<strong>Carmen♡</strong></a>
<nav class="main-nav" aria-label="Hlavní navigace"><a href="index.html">Domů</a><a href="svet.html">Svět příběhů</a><a href="komiksy-lusssita-monty.html">Archiv komiksů</a></nav>
<button class="top-like-btn" id="likeButton" type="button" disabled>♡ Líbí se mi…</button>
</header>
<main class="comic-world">
<div class="pop left">BOOM!</div><div class="pop right">POW!</div>
<section class="reader">
<h1 class="reader-title">Operace kufr</h1>
<div class="stage"><div class="page-shell" id="pageShell"></div></div>
<div class="status" id="statusText">Obálka</div>
<div class="controls hidden" id="readerControls">
<button class="nav-button prev" id="prevButton" type="button" disabled>← Předchozí</button>
<div class="dots" id="dots"></div>
<button class="nav-button next" id="nextButton" type="button">Další stránka →</button>
</div>
<div class="end-panel" id="endPanel"><div class="end-box"><h2>Konec komiksu</h2></div><div><a class="back-library" href="komiksy-lusssita-monty.html">← Zpět do knihovny</a></div></div>
</section>
<footer>Jeden den. Jeden komiks. Jeden úsměv. ♡</footer>
</main>
<script>
(function(){
"use strict";
const coverPath =
"/assets/komiksy/komiks-001-operace-kufr/komiks-001-operace-kufr-cover.png?v=2";

const pages = [
  "/assets/komiksy/komiks-001-operace-kufr/komiks-001-operace-kufr-01.jpeg?v=2",
  "/assets/komiksy/komiks-001-operace-kufr/komiks-001-operace-kufr-02.jpeg?v=2",
  "/assets/komiksy/komiks-001-operace-kufr/komiks-001-operace-kufr-03.jpeg?v=2",
  "/assets/komiksy/komiks-001-operace-kufr/komiks-001-operace-kufr-04.jpeg?v=2",
  "/assets/komiksy/komiks-001-operace-kufr/komiks-001-operace-kufr-05.jpeg?v=2",
  "/assets/komiksy/komiks-001-operace-kufr/komiks-001-operace-kufr-06.jpeg?v=2",
  "/assets/komiksy/komiks-001-operace-kufr/komiks-001-operace-kufr-07.jpeg?v=2",
  "/assets/komiksy/komiks-001-operace-kufr/komiks-001-operace-kufr-08.jpeg?v=2",
  "/assets/komiksy/komiks-001-operace-kufr/komiks-001-operace-kufr-09.jpeg?v=2"
];
const shell=document.getElementById("pageShell"),status=document.getElementById("statusText"),controls=document.getElementById("readerControls"),prev=document.getElementById("prevButton"),next=document.getElementById("nextButton"),dots=document.getElementById("dots"),end=document.getElementById("endPanel");
let mode="cover",index=0,busy=false,touchStart=0;
pages.forEach(()=>{const d=document.createElement("span");d.className="dot";dots.appendChild(d)});
function showError(path){shell.innerHTML='<div class="error-box">Obrázek se nepodařilo načíst.<br><small>'+path+'</small></div>'}
function renderCover(){
mode="cover";controls.classList.add("hidden");end.classList.remove("show");status.textContent="Obálka";
shell.innerHTML='<figure class="cover-view"><img id="coverImage" src="'+coverPath+'" alt="Operace kufr – obálka"><div class="cover-actions"><button class="start-button" id="startButton" type="button">▶ Začít číst</button></div></figure>';
document.getElementById("coverImage").addEventListener("error",()=>showError(coverPath),{once:true});
document.getElementById("startButton").addEventListener("click",()=>{index=0;renderPage()});
}
function renderPage(){
mode="reading";controls.classList.remove("hidden");const path=pages[index];
shell.innerHTML='<figure class="comic-page"><img id="comicImage" src="'+path+'" alt="Operace kufr – stránka '+(index+1)+' z '+pages.length+'"></figure>';
document.getElementById("comicImage").addEventListener("error",()=>showError(path),{once:true});
status.textContent='Strana '+(index+1)+' z '+pages.length;
prev.disabled=index===0;const last=index===pages.length-1;next.disabled=last;end.classList.toggle("show",last);
[...dots.children].forEach((d,i)=>d.classList.toggle("active",i===index));
}
function turn(dir){
if(busy||mode!=="reading")return;const target=dir==="next"?index+1:index-1;if(target<0||target>=pages.length)return;busy=true;
const out=dir==="next"?"flip-next-out":"flip-prev-out",inn=dir==="next"?"flip-next-in":"flip-prev-in";shell.classList.add(out);
setTimeout(()=>{index=target;renderPage();shell.classList.remove(out);shell.classList.add(inn);void shell.offsetWidth;shell.classList.remove(inn);setTimeout(()=>busy=false,300)},260);
}
prev.addEventListener("click",()=>turn("prev"));next.addEventListener("click",()=>turn("next"));
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")turn("next");if(e.key==="ArrowLeft")turn("prev")});
shell.addEventListener("touchstart",e=>touchStart=e.changedTouches[0].clientX,{passive:true});
shell.addEventListener("touchend",e=>{const d=e.changedTouches[0].clientX-touchStart;if(Math.abs(d)>45)turn(d<0?"next":"prev")},{passive:true});
[coverPath,...pages].forEach(path=>{const img=new Image();img.src=path});
renderCover();

const SUPABASE_URL="https://lggboavbzzvoomveewtl.supabase.co",SUPABASE_KEY="sb_publishable_3Z7UGlah1I0yJE7gHQQ57A_1XNEeauM",PAGE_ID="komiks-001-operace-kufr",like=document.getElementById("likeButton"),storageKey=`svetCarmenLike_${PAGE_ID}`;
function today(){const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`}
async function rpc(name){const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`,{method:"POST",headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({requested_page_id:PAGE_ID})});if(!r.ok)throw new Error(await r.text());return r.json()}
function ready(c){like.textContent=`♡ Líbí se mi ${Number(c)||0}`;like.disabled=false;like.classList.remove("is-liked")}function thanks(c){like.textContent=`♥ Děkujeme ${Number(c)||0}`;like.disabled=true;like.classList.add("is-liked")}
async function load(){try{const c=await rpc("get_page_likes");localStorage.getItem(storageKey)===today()?thanks(c):ready(c)}catch(e){console.error(e);like.textContent="♡ Líbí se mi";like.disabled=false}}
like.addEventListener("click",async()=>{if(like.disabled||localStorage.getItem(storageKey)===today())return;like.disabled=true;like.textContent="♡ Odesílám…";try{const c=await rpc("add_page_like");localStorage.setItem(storageKey,today());thanks(c)}catch(e){console.error(e);like.textContent="♡ Zkusit znovu";like.disabled=false}});
load();
})();
</script>
</body>
</html>
